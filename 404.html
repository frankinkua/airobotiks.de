<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 - Seite nicht gefunden | AI Robotiks</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/style.css">
    <style>
        .error-container {
            text-align: center;
            padding: 100px 20px;
        }
        .error-code {
            font-size: clamp(5rem, 15vw, 10rem);
            color: var(--cyan);
            font-family: var(--font-heading);
            line-height: 1;
            text-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <main role="main" class="container">
        <div class="error-container">
            <div class="error-code">404</div>
            <h2>System offline / Pfad nicht gefunden</h2>
            <p>Die angeforderte Ressource konnte im Verzeichnis nicht lokalisiert werden. Möglicherweise wurde die Seite verschoben oder existiert nicht.</p>
            <p style="margin-top: 2rem;">
                <a href="/" style="font-size: 1.2rem; border: 2px solid var(--lime); padding: 10px 20px; border-radius: 4px;">SYSTEM NEUSTARTEN (Zurück zur Startseite)</a>
            </p>
        </div>
    </main>
</body>
</html>
